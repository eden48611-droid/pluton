version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pluton-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pluton
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/migrations/001_phase1_base_schema.sql:/docker-entrypoint-initdb.d/002_migration.sql:ro
      - ./database/seeds/001_realistic_seed_data.sql:/docker-entrypoint-initdb.d/003_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pluton"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pluton-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pluton
      DB_USER: postgres
      DB_PASSWORD: postgres
    command: npm start

volumes:
  pgdata:
